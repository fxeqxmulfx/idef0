<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IDEF0 Editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='7' y='9' width='18' height='14' fill='white' stroke='black' stroke-width='2'/%3E%3Cpath d='M1 16h6M25 16h6M16 1v8M16 23v8' stroke='black' stroke-width='2'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>IDEF0 Editor</h1>
      <div class="actions">
        <button id="open" type="button" class="secondary" aria-keyshortcuts="Control+O Meta+O">Open</button>
        <button id="save" type="button" class="secondary" aria-keyshortcuts="Control+S Meta+S">Save</button>
      </div>
      <span id="file-name" hidden></span>
      <span id="status" role="status"></span>
      <div class="actions end">
        <button id="show-skill" type="button" class="secondary" aria-haspopup="dialog">Skill</button>
        <button id="download" type="button" disabled>Download PDF</button>
      </div>
    </header>
    <main>
      <section class="source">
        <div id="editor"></div>
        <ul id="problems" aria-label="Problems" hidden></ul>
      </section>
      <section id="preview" aria-label="PDF preview"></section>
    </main>
    <dialog id="skill" aria-labelledby="skill-title">
      <div class="bar">
        <h2 id="skill-title">Skill</h2>
        <button type="button" class="secondary" data-action="copy">Copy</button>
        <button type="button" class="secondary" data-action="download">Download SKILL.md</button>
        <button type="button" class="close" data-action="close" aria-label="Close">×</button>
      </div>
      <div class="skill-body prose">
        <p class="note">
          This guide is also a skill for AI assistants: paste it into a chat, or save it as
          <code>~/.claude/skills/idef0/SKILL.md</code> for Claude Code.
        </p>
      </div>
    </dialog>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
